<main class="bg-gray-100 min-h-screen">
  <div class="max-w-5xl mx-auto px-4 py-12">
    <header class="mb-10">
      <h1 class="text-3xl font-bold text-center text-gray-900">Your Shifts</h1>
      <p class="mt-2 text-center text-gray-600">Review and manage your upcoming schedule below.</p>
    </header>

    <main class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <table class="w-full text-left border-collapse">
        <thead class="bg-gray-50 border-b border-gray-200">
        <tr>
          <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">
            Date
          </th>
          <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">
            Unit
          </th>
          <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">
            Shift Type
          </th>
          <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">
            Notes
          </th>
          <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">
          </th>
        </tr>
        </thead>

        <tbody class="divide-y divide-gray-100">
        <tr class="hover:bg-gray-50 transition-colors">
          <td class="px-6 py-4 text-sm text-gray-700 font-medium">May 1, 2026</td>
          <td class="px-6 py-4 text-sm text-gray-700 font-medium">ICU</td>
          <td class="px-6 py-4 text-sm text-gray-700 font-medium">Night</td>
          <td class="px-6 py-4 text-sm text-gray-700 font-medium">Overtime Shift</td>
          <td class="px-6 py-4 text-sm text-gray-700 font-medium text-center">
            <button class="rounded-md bg-blue-500 text-white font-bold px-4 py-2 sm:w-30
      hover:bg-blue-600 active:opacity-80">Edit</button>
          </td>

        </tr>
        </tbody>
      </table>
    </main>
  </div>
</main>
