<main class="bg-gray-100 min-h-screen">
  <div class="max-w-5xl mx-auto px-4 py-12">
    <header class="mb-10 flex justify-center items-center">
      <div>
        <h1 class="text-3xl font-bold text-gray-900 text-center">Your Shifts</h1>
        <p class="mt-2 text-gray-600 text-center">Review and manage your upcoming schedule below.</p>
      </div>
    </header>
    <div class="flex justify-end mb-8">
      <a routerLink="/create-shift">
        <button class="rounded-md bg-blue-500 text-white font-bold sm:px-4 py-2 sm:w-30
          hover:bg-blue-600 active:opacity-80"
        >
          Add Shift
        </button>
      </a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <table class="w-full text-left border-collapse">
        <thead class="bg-gray-50 border-b border-gray-200">
        <tr>
          <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">
            Date
          </th>
          <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">
            Unit
          </th>
          <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">
            Shift Type
          </th>
          <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">
            Notes
          </th>
          <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">
          </th>
        </tr>
        </thead>

        <tbody class="divide-y divide-gray-100">

          @for(shift of shifts$ | async; track shift.id) {
            <tr class="hover:bg-gray-50 transition-colors">
              <td class="px-6 py-4 text-sm text-gray-700 font-medium">{{ shift.date | date }}</td>
              <td class="px-6 py-4 text-sm text-gray-700 font-medium">{{  shift.unit }}</td>
              <td class="px-6 py-4 text-sm text-gray-700 font-medium">{{ shift.shiftType }}</td>
              <td class="px-6 py-4 text-sm text-gray-700 font-medium">{{ shift.notes }}</td>
              <td class="px-6 py-4 text-sm text-gray-700 font-medium text-center">
                <button (click)="handleEdit(shift.id)"
                  class="rounded-md bg-blue-500 text-white font-bold px-4 py-2 sm:w-30
                hover:bg-blue-600 active:opacity-80">Edit</button>
              </td>
              <td class="pl-2 pr-6 py-4 text-sm text-gray-700 font-medium text-center">
                <button class="rounded-md bg-red-500 text-white font-bold px-1 py-1 w-8
                hover:bg-blue-600 active:opacity-80"
                  (click)="prepareDelete(shift.id)"
                  data-modal-target="delete-modal"
                  data-modal-toggle="delete-modal"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                  </svg>

                </button>
              </td>

            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</main>

<!-- Delete Confirmation Modal -->

      justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
